<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>没有这一页 · 梦诗</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #0d1117 radial-gradient(ellipse 80% 55% at 50% 38%, #1b2745 0%, #0d1117 70%);
    font-family: "Noto Serif SC", "Songti SC", serif;
    color: #e8e4d8;
    overflow: hidden;
  }
  .moon {
    position: absolute; top: 12%; right: 16%;
    width: 74px; height: 74px; border-radius: 50%;
    background: radial-gradient(circle at 38% 35%, #fdf6dd, #e8d9a0 70%, #d9c078);
    box-shadow: 0 0 60px 18px rgba(240, 220, 150, .22);
    opacity: .55;
  }
  main { text-align: center; padding: 2rem; position: relative; z-index: 1; }
  h1 { font-size: clamp(3rem, 10vw, 5.5rem); letter-spacing: .2em; color: #f2ecd9; font-weight: 600; }
  .verse { margin-top: 1.8rem; font-size: 1.05rem; line-height: 2.1; color: #c9c2ae; }
  a.back {
    display: inline-block; margin-top: 2.6rem;
    color: #e8e4d8; text-decoration: none;
    border: 1px solid #39415a; border-radius: 10px;
    padding: .85rem 1.7rem; letter-spacing: .2em; font-size: .95rem;
    background: rgba(27, 39, 69, .35);
    transition: transform .22s cubic-bezier(0.23,1,0.32,1), border-color .22s cubic-bezier(0.23,1,0.32,1);
  }
  a.back:hover { transform: translateY(-2px); border-color: #c8a94e; }
</style>
</head>
<body>
  <div class="moon"></div>
  <main>
    <h1>404</h1>
    <p class="verse">这一页被月亮藏起来了，<br>梦里也没有。</p>
    <a class="back" href="index.html">← 回到首页</a>
  </main>
</body>
</html>
