  <main>
    <h1>诗页</h1>
    <p class="sub">先放三首 · 慢慢添</p>

    <section>
      <h2>静夜思</h2>
      <p class="author">唐 · 李白</p>
      <p class="poem">床前明月光，疑是地上霜。<br>举头望明月，低头思故乡。</p>
    </section>

    <section>
      <h2>山居秋暝</h2>
      <p class="author">唐 · 王维</p>
      <p class="poem">空山新雨后，天气晚来秋。<br>明月松间照，清泉石上流。<br>竹喧归浣女，莲动下渔舟。<br>随意春芳歇，王孙自可留。</p>
    </section>

    <section>
      <h2>江城子 · 乙卯正月二十日夜记梦</h2>
      <p class="author">宋 · 苏轼</p>
      <p class="poem">十年生死两茫茫，不思量，自难忘。<br>千里孤坟，无处话凄凉。<br>纵使相逢应不识，尘满面，鬓如霜。<br><br>夜来幽梦忽还乡，小轩窗，正梳妆。<br>相顾无言，惟有泪千行。<br>料得年年肠断处，明月夜，短松冈。</p>
    </section>
  </main>
