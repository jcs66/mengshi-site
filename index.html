<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梦诗 · MengShi</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #0d1117 radial-gradient(ellipse 80% 55% at 50% 38%, #1b2745 0%, #0d1117 70%);
    font-family: "Noto Serif SC", "Songti SC", serif;
    color: #e8e4d8;
    overflow: hidden;
  }
  .moon {
    position: absolute; top: 12%; right: 16%;
    width: 74px; height: 74px; border-radius: 50%;
    background: radial-gradient(circle at 38% 35%, #fdf6dd, #e8d9a0 70%, #d9c078);
    box-shadow: 0 0 60px 18px rgba(240, 220, 150, .22);
  }
  main { text-align: center; padding: 2rem; position: relative; z-index: 1; }
  h1 {
    font-size: clamp(3.4rem, 11vw, 6.5rem);
    letter-spacing: .28em; font-weight: 600;
    color: #f2ecd9; text-shadow: 0 2px 30px rgba(240,220,150,.25);
  }
  .latin { margin-top: .6rem; letter-spacing: .55em; font-size: .8rem; color: #8b93a7; text-transform: uppercase; }
  .verse { margin-top: 2.6rem; font-size: clamp(1rem, 3.4vw, 1.25rem); line-height: 2.1; color: #c9c2ae; }
  .meta { margin-top: 3.2rem; font-size: .78rem; color: #5f6578; letter-spacing: .12em; line-height: 1.9; }
  .dot { color: #c8a94e; }
</style>
</head>
<body>
  <div class="moon"></div>
  <main>
    <h1>梦诗</h1>
    <div class="latin">MengShi · de5.net</div>
    <p class="verse">梦里拾句，醒时成诗。<br>这是我的第一个域名，安放一些慢慢写的东西。</p>
    <p class="meta">mengshi.de5.net <span class="dot">·</span> DNS 托管于 Cloudflare <span class="dot">·</span> 2026-10-31 点亮</p>
  </main>
</body>
</html>
